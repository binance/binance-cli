[package]
name = "binance-cli"
version = "2.0.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
binance-sdk = { version = "64.0.0", features = ["all"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
openssl = { version = "0.10", features = ["vendored"] }
rust_decimal = "1.42.0"
pulldown-cmark = "0.12"
html2text = "0.12"
dialoguer = "0.12.0"
dirs = "6.0.0"
url = "2.5.8"
reqwest = "0.13.4"

[build-dependencies]
rustc_version = "0.4"